openapi: 3.1.0
info:
  title: wb-newsfeed API
  version: 1.0.0
  description: |
    REST-API für Redaktion (Admin-CMS), Short-Form-Feed und externe Systeme.

    **Authentifizierung:** Alle Endpunkte verlangen den Header `x-api-key`
    (Wert aus `.env`, `API_KEY`), außer den als *öffentlich* markierten
    (`security: []`): Feed, Engagement (Like/Share/Kommentare), Analytics-Events,
    `/api/sysinfo` und statische Bilder unter `/images/`.

    **Generierung** läuft asynchron über BullMQ. Teaser, Kernpunkte und Tags
    erzeugt ein Sprachmodell über Ollama, Titelbilder der Bildserver in `services/image`
    (Z-Image-Turbo oder FLUX.1-schnell) oder wahlweise Google Gemini. Endpunkte, die eine Generierung
    auslösen, liefern eine Job-ID; der Status ist über `/api/jobs/{id}` abrufbar.
    Jedes Textergebnis wird als Version gespeichert (`/api/articles/{id}/versions`).

    **Ausprobieren:** Oben rechts auf *Authorize* klicken und den API-Key eintragen.

    Architektur und Abläufe: `docs/architektur.md`.
servers:
  - url: http://localhost:3005
    description: Lokale Entwicklung
security:
  - apiKey: []
tags:
  - name: Feed
    description: Öffentlicher Short-Form-Feed
  - name: Artikel
  - name: Versionen
    description: Versionierte Generierungsergebnisse (Teaser, Kernpunkte)
  - name: Jobs
    description: Asynchrone Generierung (BullMQ)
  - name: Engagement
    description: Öffentliche Interaktionen aus dem Feed
  - name: Tags
  - name: Analytics
  - name: Import
    description: Artikel aus externen Quellen (RSS 1.0/2.0, Atom)
  - name: Einstellungen
  - name: System

paths:
  /api/feed:
    get:
      tags: [Feed]
      summary: Veröffentlichte Artikel für den Feed
      description: |
        Liefert nur Artikel mit `status = published`, neueste zuerst.
        Serverseitig gecacht (invalidiert bei jeder Artikel- oder Tag-Änderung,
        spätestens nach 60 s). Antwortet mit `ETag`; bei passendem
        `If-None-Match` kommt `304 Not Modified` ohne Body.
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string }, description: 'Kategorie-Filter, `Alle` = kein Filter' }
        - { name: tag, in: query, schema: { type: string }, description: Tag-Slug oder -Name }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Artikelliste
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-cache } }
            X-Feed-Cache: { schema: { type: string, enum: [HIT, MISS, BYPASS] }, description: 'Serverseitiger Cache-Status (BYPASS = DB offline)' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Article' } }
        '304': { description: Unverändert seit dem übergebenen ETag }

  /api/articles:
    get:
      tags: [Artikel]
      summary: Alle Artikel (inkl. Entwürfe)
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
      responses:
        '200':
          description: Artikelliste, neueste zuerst
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Article' } }
    post:
      tags: [Artikel]
      summary: Artikel anlegen
      description: |
        Fehlende Titel/Kategorie/Tags werden vorläufig heuristisch ergänzt.
        Ohne mitgeschickten `teaser` wird automatisch eine Generierung
        eingereiht (`generationJobId`); mit `generate: false` unterbleibt sie.
        Ein Titelbild erzeugt derselbe Job nur, wenn die Einstellung `autoImage` auf `true` steht
        (`full_generation`), sonst über `POST /api/articles/{id}/generate-image`.
        Ein mitgeschickter Teaser wird als manuelle Version gespeichert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleInput'
                - type: object
                  required: [content]
                  properties:
                    generate: { type: boolean, default: true }
      responses:
        '200':
          description: Angelegter Artikel
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Article'
                  - type: object
                    properties:
                      generationJobId: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/articles/quick:
    post:
      tags: [Artikel]
      summary: Schnell-Ingest aus Rohtext
      description: Legt einen veröffentlichten Artikel an; Titel, Kategorie, Teaser, Tags und Titelbild werden asynchron erzeugt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 10 }
                content: { type: string, description: Alias für `text` }
      responses:
        '200':
          description: Artikel angelegt, Job eingereiht (`success = false`, wenn Redis nicht erreichbar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  article: { $ref: '#/components/schemas/Article' }
                  jobId: { type: string, example: job-42 }
                  error: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/articles/generate:
    post:
      tags: [Artikel]
      summary: Artikel synchron generieren und anlegen
      description: Wie `quick`, aber die Generierung läuft direkt im Request (kein Job-Polling). Optional mit Titelbild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleInput'
                - type: object
                  required: [content]
                  properties:
                    generateImage: { type: boolean, default: false }
      responses:
        '200':
          description: Angelegter Artikel mit Generierungsergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  article: { $ref: '#/components/schemas/Article' }
                  imagePath: { type: [string, 'null'] }
                  imageError: { type: string, description: 'Nur gesetzt, wenn das Bild nicht erzeugt werden konnte' }
                  summary:
                    type: object
                    properties:
                      teaser: { type: string }
                      keyTakeaways: { type: string }
                      source: { $ref: '#/components/schemas/GenerationSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Error' }

  /api/articles/auto-extract:
    post:
      tags: [Artikel]
      summary: Metadaten heuristisch vorschlagen (ohne Sprachmodell, ohne Speichern)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                category: { type: string }
      responses:
        '200':
          description: Vorschlag für Titel, Kategorie, Tags, Teaser, Kernpunkte
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/articles/{id}:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    get:
      tags: [Artikel]
      summary: Einzelnen Artikel lesen
      responses:
        '200':
          description: Artikel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Artikel]
      summary: Artikel ändern
      description: |
        Teiländerung. Ändert sich `content` (und nicht gleichzeitig der Teaser),
        wird der Teaser asynchron neu generiert (`generationJobId`).
        Ein geänderter `teaser`/`keyTakeaways` wird als manuelle Version gespeichert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleInput' }
      responses:
        '200':
          description: Aktualisierter Artikel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  article: { $ref: '#/components/schemas/Article' }
                  tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
                  generationJobId: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Artikel]
      summary: Artikel löschen (inkl. Kommentare, Events, Jobs, Versionen)
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/articles/{id}/image:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    post:
      tags: [Artikel]
      summary: Titelbild hochladen
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: 'Bilddatei, max. 10 MB' }
      responses:
        '200':
          description: Bild gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  imageUrl: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Artikel]
      summary: Titelbild entfernen
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/articles/{id}/generate-image:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    post:
      tags: [Artikel]
      summary: Titelbild erzeugen
      description: |
        Je nach Einstellung `imageProvider` über den eigenen Bildserver (Z-Image-Turbo oder
        FLUX.1-schnell, vorher Szenenbeschreibung über Ollama) oder über Google Gemini
        (Nano Banana Pro). Hochformat 9:16. Läuft synchron.
        Ein vorhandenes Titelbild wird ersetzt und gelöscht.
      responses:
        '200':
          description: Bild erzeugt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  imageUrl: { type: string }
                  article: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }
        '503':
          description: Bildserver nicht erreichbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/articles/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    get:
      tags: [Versionen]
      summary: Alle Versionen der generierten Inhalte, neueste zuerst
      responses:
        '200':
          description: Versionsliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GenerationVersion' } }

  /api/articles/{id}/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Versionen]
      summary: Alte Version wiederherstellen
      description: Setzt Teaser und Kernpunkte auf die gewählte Version und legt dafür eine neue Version mit `restoredFrom` an. Die Historie wird nie überschrieben.
      responses:
        '200':
          description: Neu angelegte Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  version: { $ref: '#/components/schemas/GenerationVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/articles/{id}/like:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    post:
      tags: [Engagement]
      summary: Like hinzufügen
      security: []
      responses:
        '200': { $ref: '#/components/responses/LikeCount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/articles/{id}/unlike:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    post:
      tags: [Engagement]
      summary: Like entfernen (nicht unter 0)
      security: []
      responses:
        '200': { $ref: '#/components/responses/LikeCount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/articles/{id}/share:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    post:
      tags: [Engagement]
      summary: Teilen zählen
      security: []
      responses:
        '200':
          description: Neuer Zählerstand
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  shareCount: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/articles/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/ArticleId' }]
    get:
      tags: [Engagement]
      summary: Kommentare, neueste zuerst
      security: []
      responses:
        '200':
          description: Kommentarliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    post:
      tags: [Engagement]
      summary: Kommentar schreiben
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                authorName: { type: string, maxLength: 60, default: Anonym }
      responses:
        '200':
          description: Gespeicherter Kommentar
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  comment: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/jobs:
    get:
      tags: [Jobs]
      summary: Jobs, neueste zuerst
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } }
      responses:
        '200':
          description: Jobliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
    post:
      tags: [Jobs]
      summary: Generierung manuell einreihen
      description: Ist Redis nicht erreichbar, wird der Job direkt ausgeführt (Text heuristisch, ohne Sprachmodell).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [articleId, type]
              properties:
                articleId: { type: integer }
                type: { $ref: '#/components/schemas/JobType' }
      responses:
        '200':
          description: Angelegter Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [Jobs]
      summary: Jobstatus abfragen
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      summary: Job aus Queue und Datenbank entfernen
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/jobs/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    post:
      tags: [Jobs]
      summary: Fehlgeschlagenen Job erneut ausführen (direkt, heuristisch)
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tags:
    get:
      tags: [Tags]
      summary: Tags mit Artikelanzahl
      responses:
        '200':
          description: Tagliste, meistverwendete zuerst
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Tag'
                    - type: object
                      properties:
                        articleCount: { type: integer }
    post:
      tags: [Tags]
      summary: Tag anlegen (existiert der Name schon, wird der bestehende geliefert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string, example: '#3b82f6' }
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Tags]
      summary: Tag löschen (Zuordnungen werden mitgelöscht)
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/analytics/events:
    post:
      tags: [Analytics]
      summary: Tracking-Event aus dem Feed erfassen
      description: Blockiert den Client nie; bei DB-Fehlern kommt ebenfalls 200 mit `success = false`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType: { type: string, enum: [impression, read, scroll_depth, share, dwell, read_time] }
                articleId: { type: [integer, 'null'] }
                metadata:
                  description: 'Beliebiges JSON oder String. Bei `dwell` (Zeit auf der Karte) und `read_time` (Zeit in der Artikelansicht) `{ "seconds": 12.5 }`'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/analytics/articles:
    get:
      tags: [Analytics]
      summary: Kennzahlen je Artikel
      description: Aufrufe, Öffnungen, durchschnittliche Verweil- und Lesedauer, schnelles Weiterwischen (unter 1,5 s) sowie Likes, Kommentare und Teilungen.
      responses:
        '200':
          description: Eine Zeile je Artikel
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    articleId: { type: integer }
                    impressions: { type: integer }
                    reads: { type: integer }
                    avgDwellSeconds: { type: [number, 'null'] }
                    avgReadSeconds: { type: [number, 'null'] }
                    quickSkips: { type: integer }
                    likes: { type: integer }
                    comments: { type: integer }
                    shares: { type: integer }

  /api/import/rss:
    post:
      tags: [Import]
      summary: Artikel aus einem RSS- oder Atom-Feed importieren
      description: |
        Legt für jeden noch nicht importierten Eintrag einen Artikel an (erkannt an der Quell-URL)
        und reiht einen Generierungsjob ein: Kategorie, Tags, Teaser, Kernpunkte, mit `autoImage` auch das Titelbild.
        Mit `fullText` wird die Artikelseite geladen und der Fließtext übernommen, sonst nur die
        Beschreibung aus dem Feed. Einträge unter 200 Zeichen werden übersprungen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, example: 'https://rss.orf.at/news.xml' }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
                fullText: { type: boolean, default: false }
                status: { type: string, enum: [draft, published], default: published }
                author: { type: string, description: 'Standard: Titel des Feeds' }
      responses:
        '200':
          description: Ergebnis des Imports
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  found: { type: integer }
                  skipped: { type: integer }
                  imported:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        jobId: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502':
          description: Feed nicht erreichbar oder nicht lesbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/analytics:
    get:
      tags: [Analytics]
      summary: Aggregierte Kennzahlen (letzte 500 Events)
      responses:
        '200':
          description: Kennzahlen
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalImpressions: { type: integer }
                  totalReads: { type: integer }
                  readThroughRate: { type: string, example: 12.5% }
                  popularArticles: { type: array, items: { type: object, additionalProperties: true } }
                  recentEventsCount: { type: integer }
                  recentEvents: { type: array, items: { type: object, additionalProperties: true } }

  /api/settings:
    get:
      tags: [Einstellungen]
      summary: Gespeicherte Einstellungen als Key-Value
      responses:
        '200':
          description: Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    post:
      tags: [Einstellungen]
      summary: Einstellungen speichern (unbekannte Keys werden ignoriert)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/settings/models:
    get:
      tags: [Einstellungen]
      summary: Verfügbare Text- und Bildmodelle
      description: Fragt Ollama und den Bildserver ab. Ist ein Dienst nicht erreichbar, steht das in `errors`.
      responses:
        '200':
          description: Modelllisten
          content:
            application/json:
              schema:
                type: object
                properties:
                  textModels: { type: array, items: { type: string } }
                  imageModels: { type: array, items: { type: string } }
                  errors:
                    type: object
                    properties:
                      ollama: { type: string }
                      imageServer: { type: string }
                  geminiKeySet: { type: boolean }

  /api/sysinfo:
    get:
      tags: [System]
      summary: Health-Check
      security: []
      responses:
        '200':
          description: Dienst läuft
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string }
                  uptime: { type: number }
                  timestamp: { type: string, format: date-time }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    ArticleId: { name: id, in: path, required: true, schema: { type: integer } }
    JobId: { name: id, in: path, required: true, schema: { type: integer } }

  responses:
    Success:
      description: Erfolgreich
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
    LikeCount:
      description: Neuer Zählerstand
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              likeCount: { type: integer }
    BadRequest:
      description: Ungültige Eingabe (z. B. keine numerische ID, Text zu kurz)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Serverfehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error: { type: string }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        color: { type: [string, 'null'] }

    ArticleInput:
      type: object
      properties:
        title: { type: string }
        content: { type: string, minLength: 10, description: HTML wird entfernt }
        teaser: { type: string }
        keyTakeaways: { type: string, description: 'Stichpunkte, getrennt durch •' }
        author: { type: string }
        category: { type: string, description: '`Auto` = vom Sprachmodell bzw. der Heuristik bestimmen' }
        status: { type: string, enum: [draft, published] }
        tags:
          type: array
          items:
            oneOf:
              - { type: string }
              - { type: object, properties: { name: { type: string } }, required: [name] }
        tagIds: { type: array, items: { type: integer } }

    Article:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        teaser: { type: [string, 'null'] }
        keyTakeaways: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        category: { type: string }
        author: { type: string }
        status: { type: string, enum: [draft, published] }
        likeCount: { type: integer }
        commentCount: { type: integer }
        shareCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        sourceUrl: { type: [string, 'null'], description: 'Herkunft bei importierten Artikeln' }
        related:
          type: array
          description: 'Nur im Feed: inhaltlich ähnliche Artikel (Kosinus-Ähnlichkeit der bge-m3-Embeddings, ab 0,55)'
          items:
            type: object
            properties:
              id: { type: integer }
              score: { type: number }
        readCount: { type: integer, description: 'Nur im Feed: wie oft der Artikel geöffnet wurde' }

    GenerationSource:
      type: string
      enum: [ai, fallback, manual]
      description: '`fallback` = Ollama nicht erreichbar, Heuristik ohne Sprachmodell'

    GenerationVersion:
      type: object
      properties:
        id: { type: integer }
        articleId: { type: integer }
        version: { type: integer, description: 'Fortlaufend je Artikel, beginnt bei 1' }
        title: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        teaser: { type: [string, 'null'] }
        keyTakeaways: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        source: { $ref: '#/components/schemas/GenerationSource' }
        model: { type: [string, 'null'] }
        temperature: { type: [number, 'null'] }
        seed: { type: [integer, 'null'] }
        contentHash: { type: [string, 'null'], description: SHA-256 des Artikeltexts zum Zeitpunkt der Generierung }
        jobId: { type: [integer, 'null'] }
        restoredFrom: { type: [integer, 'null'], description: Versionsnummer, aus der wiederhergestellt wurde }
        createdAt: { type: string, format: date-time }

    JobType:
      type: string
      enum: [teaser_generation, image_generation, full_generation]

    JobStatus:
      type: string
      enum: [pending, processing, completed, failed]

    Job:
      type: object
      properties:
        id: { type: integer }
        jobId: { type: integer, description: Alias für `id` }
        articleId: { type: [integer, 'null'] }
        type: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobStatus' }
        result: { type: [string, 'null'], description: 'z. B. „Teaser und Bild generiert“' }
        error: { type: [string, 'null'] }
        processingTimeMs: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: integer }
        articleId: { type: integer }
        authorName: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    Settings:
      type: object
      properties:
        ollamaUrl: { type: string }
        aiModel: { type: string }
        timeout: { type: string, description: Millisekunden }
        temperature: { type: string, description: '0–2, Standard 0 (reproduzierbar)' }
        seed: { type: string, description: 'Ganzzahl, Standard 42' }
        autoImage: { type: string, enum: ['true', 'false'], description: 'Neue Artikel bekommen automatisch ein Titelbild, Standard false' }
        imageProvider: { type: string, enum: [local, gemini], description: 'local = eigener Bildserver, gemini = Google Gemini (Key in GEMINI_API_KEY)' }
        imageServerUrl: { type: string, description: 'Standard http://localhost:8080' }
        geminiModel: { type: string, example: gemini-3-pro-image-preview }
        geminiImageSize: { type: string, enum: [1K, 2K, 4K] }
        embeddingModel: { type: string, description: 'Ollama-Modell für Embeddings, Standard bge-m3' }
        imageTimeout: { type: string, description: Millisekunden }
