version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: wb_newsfeed_postgres
    environment:
      POSTGRES_USER: wb_user
      POSTGRES_PASSWORD: wb_password
      POSTGRES_DB: wb_newsfeed
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb_user -d wb_newsfeed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wb_newsfeed_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: wb_newsfeed_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  localai:
    # CPU image: no NVIDIA GPU on the dev machine. Core image is multi-arch,
    # but LocalAI's image-generation backends (diffusers, stablediffusion-ggml)
    # are currently amd64-only — they fail to install on Apple Silicon (arm64)
    # hosts with "no child with platform linux/arm64 in index". Works fine on
    # amd64 (Intel/AMD Windows, Linux, Intel Mac).
    image: localai/localai:latest
    container_name: wb_newsfeed_localai
    ports:
      - "8080:8080"
    environment:
      - MODELS_PATH=/models
    volumes:
      - localai_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  localai_models:
